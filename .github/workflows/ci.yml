name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:perf
        env:
          OKS_REUSE_BUILD: "1"
      - run: pnpm check:repo
      - run: pnpm check:migrations

  # The plugin memory cap needs control groups and rights that the normal runner step does not have, so the sandbox
  # tests run again here in a container that may manage them (spec 04, PL-10 and PL-31).
  sandbox-memory:
    name: Plugin memory cap (Docker)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the sandbox tests as root with a memory cap
        run: |
          docker run --rm --privileged --network host \
            -v "$PWD:/work" -w /work \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres \
            -e OKS_EXPECT_MEMORY_CAP=1 -e OKS_DEBUG_SANDBOX=1 \
            node:22 bash -c "corepack enable && pnpm install --frozen-lockfile && pnpm exec tsc -b && pnpm exec vitest run packages/sandbox"

  # S8: the minimal site as a Docker image, run under memory limits of 512 MB, 1 GB and 2 GB. The table goes into the
  # job summary and becomes the "hosting requirements" table. The job fails when a container is killed for memory.
  hosting-baseline:
    name: Hosting baseline (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Make a small sample database
        run: pnpm exec tsx apps/site/test/make-sample-db.ts "$RUNNER_TEMP/data/site.sqlite"
      - name: Build the image
        run: docker build -f docker/site.Dockerfile -t oks-site .
      - name: Measure memory and start time under limits
        run: scripts/hosting-baseline.sh oks-site "$RUNNER_TEMP/data/site.sqlite"
